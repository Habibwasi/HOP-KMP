<!DOCTYPE html>
<html>
<head>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: transparent; padding: 16px; }

.tabs { display: flex; gap: 8px; margin-bottom: 14px; }
.tab {
  padding: 8px 18px; border-radius: var(--border-radius-md);
  border: 0.5px solid var(--color-border-secondary);
  background: var(--color-background-primary);
  color: var(--color-text-secondary); cursor: pointer;
  font-size: 13px; font-family: var(--font-sans); transition: all 0.15s;
}
.tab.active {
  background: var(--color-background-info);
  color: var(--color-text-info);
  border-color: var(--color-border-info);
}
.tab:hover:not(.active) { background: var(--color-background-secondary); }

.card {
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  overflow: hidden; background: var(--color-background-primary);
}
.card svg { display: block; width: 100%; }
.label {
  font-size: 12px; color: var(--color-text-secondary);
  margin-bottom: 8px;
}

.export-btn {
  margin-top: 10px; padding: 8px 16px;
  border-radius: var(--border-radius-md);
  border: 0.5px solid var(--color-border-secondary);
  background: var(--color-background-secondary);
  color: var(--color-text-secondary);
  font-size: 12px; font-family: var(--font-sans);
  cursor: pointer;
}
.export-btn:hover { background: var(--color-background-primary); }
</style>
</head>

<div class="tabs">
  <button class="tab active" onclick="show(0,this)">Slide 1</button>

let current = 0;

function show(i, btn) {
  current = i;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('lbl').textContent = labels[i];
  document.getElementById('card').innerHTML = svgs[i];
}

function exportSVG() {
  const blob = new Blob([svgs[current]], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `hop-slide-${current+1}.svg`; a.click();
  URL.revokeObjectURL(url);
}

show(0, document.querySelector('.tab'));

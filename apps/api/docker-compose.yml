version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: hop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hop
      POSTGRES_PASSWORD: hop_secret
      POSTGRES_DB: hop_db
    ports:
      - '5432:5432'
    volumes:
      - hop_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hop_redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  hop_postgres_data:
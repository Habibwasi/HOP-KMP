AWSTemplateFormatVersion: '2010-09-09'
Description: Hop staging infrastructure

Parameters:
  DBPassword:
    Type: String
    NoEcho: true
  ImageUri:
    Type: String
  CertificateArn:
    Type: String
    Description: ACM certificate ARN for the staging domain (required for wss:// WebSocket)
  SupabaseUrl:
    Type: String
  SupabaseAnonKey:
    Type: String
    NoEcho: true
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
  SupabaseJwtSecret:
    Type: String
    NoEcho: true
  GoogleMapsApiKey:
    Type: String
    NoEcho: true
  AdminSecret:
    Type: String
    NoEcho: true
  TwilioAccountSid:
    Type: String
  TwilioAuthToken:
    Type: String
    NoEcho: true
  TwilioVerifyServiceSid:
    Type: String
  StripeSecretKey:
    Type: String
    NoEcho: true
    Default: sk_test_placeholder
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Default: whsec_placeholder
  FirebaseProjectId:
    Type: String
    Default: placeholder
  FirebaseClientEmail:
    Type: String
    Default: placeholder@placeholder.iam.gserviceaccount.com
  FirebasePrivateKey:
    Type: String
    NoEcho: true
    Default: placeholder
  ApnsKeyId:
    Type: String
    Default: placeholder
  ApnsTeamId:
    Type: String
    Default: placeholder
  ApnsBundleId:
    Type: String
    Default: com.example.hop
  ApnsKeyPath:
    Type: String
    Default: ./apns.p8

Resources:

  # ─── VPC ────────────────────────────────────────────────────────────────────
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: hop-staging-vpc}]

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: eu-west-1a
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: eu-west-1b
      MapPublicIpOnLaunch: true

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: eu-west-1a

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: eu-west-1b

  IGW:
    Type: AWS::EC2::InternetGateway

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref IGW

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ─── SECURITY GROUPS ────────────────────────────────────────────────────────
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB security group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks security group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS security group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ECSSecurityGroup

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis security group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref ECSSecurityGroup

  # ─── RDS ────────────────────────────────────────────────────────────────────
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Hop DB subnet group
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: hop-staging-db
      DBInstanceClass: db.t3.micro
      Engine: postgres
      EngineVersion: '16.13'
      MasterUsername: hop
      MasterUserPassword: !Ref DBPassword
      DBName: hop_db
      AllocatedStorage: 20
      StorageType: gp2
      VPCSecurityGroups: [!GetAtt DBSecurityGroup.GroupId]
      DBSubnetGroupName: !Ref DBSubnetGroup
      BackupRetentionPeriod: 0
      

  # ─── ELASTICACHE ────────────────────────────────────────────────────────────
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Hop Redis subnet group
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  RedisCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      ClusterName: hop-staging-redis
      CacheNodeType: cache.t3.micro
      Engine: redis
      NumCacheNodes: 1
      VpcSecurityGroupIds: [!GetAtt RedisSecurityGroup.GroupId]
      CacheSubnetGroupName: !Ref RedisSubnetGroup

  # ─── ECS ────────────────────────────────────────────────────────────────────
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: hop-staging

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /hop/staging/api
      RetentionInDays: 7

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: hop-api-staging
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: 512
      Memory: 1024
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: hop-api
          Image: !Ref ImageUri
          PortMappings:
            - ContainerPort: 3000
          Environment:
            - Name: NODE_ENV
              Value: staging
            - Name: PORT
              Value: '3000'
            - Name: DATABASE_URL
              Value: !Sub
                - postgresql://hop:${DBPassword}@${DBEndpoint}:5432/hop_db
                - DBEndpoint: !GetAtt Database.Endpoint.Address
            - Name: REDIS_HOST
              Value: !GetAtt RedisCluster.RedisEndpoint.Address
            - Name: REDIS_PORT
              Value: '6379'
            - Name: SUPABASE_URL
              Value: !Ref SupabaseUrl
            - Name: SUPABASE_ANON_KEY
              Value: !Ref SupabaseAnonKey
            - Name: SUPABASE_SERVICE_ROLE_KEY
              Value: !Ref SupabaseServiceRoleKey
            - Name: SUPABASE_JWT_SECRET
              Value: !Ref SupabaseJwtSecret
            - Name: GOOGLE_MAPS_API_KEY
              Value: !Ref GoogleMapsApiKey
            - Name: ADMIN_SECRET
              Value: !Ref AdminSecret
            - Name: TWILIO_ACCOUNT_SID
              Value: !Ref TwilioAccountSid
            - Name: TWILIO_AUTH_TOKEN
              Value: !Ref TwilioAuthToken
            - Name: TWILIO_VERIFY_SERVICE_SID
              Value: !Ref TwilioVerifyServiceSid
            - Name: STRIPE_SECRET_KEY
              Value: !Ref StripeSecretKey
            - Name: STRIPE_WEBHOOK_SECRET
              Value: !Ref StripeWebhookSecret
            - Name: FIREBASE_PROJECT_ID
              Value: !Ref FirebaseProjectId
            - Name: FIREBASE_CLIENT_EMAIL
              Value: !Ref FirebaseClientEmail
            - Name: FIREBASE_PRIVATE_KEY
              Value: !Ref FirebasePrivateKey
            - Name: APNS_KEY_ID
              Value: !Ref ApnsKeyId
            - Name: APNS_TEAM_ID
              Value: !Ref ApnsTeamId
            - Name: APNS_BUNDLE_ID
              Value: !Ref ApnsBundleId
            - Name: APNS_KEY_PATH
              Value: !Ref ApnsKeyPath
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /hop/staging/api
              awslogs-region: eu-west-1
              awslogs-stream-prefix: api
          Essential: true

  # ─── ALB ────────────────────────────────────────────────────────────────────
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: hop-staging-alb
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      SecurityGroups: [!Ref ALBSecurityGroup]
      Scheme: internet-facing

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: hop-staging-tg
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /api/v1/health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      # Sticky sessions ensure Socket.io long-poll fallback always hits the
      # same task. Pure websocket mode doesn't require this, but it is
      # harmless and essential if polling is ever re-enabled.
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: 'true'
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: '86400'

  # ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
  ALBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  # ── HTTPS listener (ws:// → wss:// upgrade handled here) ────────────────────
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  ECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - ALBListener
      - ALBListenerHTTP
    Properties:
      ServiceName: hop-api-staging
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
          SecurityGroups: [!Ref ECSSecurityGroup]
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: hop-api
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup

Outputs:
  ALBURL:
    Value: !Sub 'https://${ALB.DNSName}'
    Description: Staging API base URL (HTTPS / WSS)
  ALBDNSName:
    Value: !GetAtt ALB.DNSName
    Description: Raw ALB DNS name (point your CNAME here)
